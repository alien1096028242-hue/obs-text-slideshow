name: Plugin Build (OBS 32.0.4 - Syntax Fix)

on: [push, pull_request]

jobs:
  windows_build:
    name: Windows Build
    runs-on: windows-2022
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          path: my-plugin

      - name: Download OBS Headers and SDK
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir obs-include
          $incPath = "$env:GITHUB_WORKSPACE\obs-include"
          git clone --depth 1 --branch 32.0.4 https://github.com/obsproject/obs-studio.git obs-src
          
          # 1. 拷贝 libobs 结构
          Copy-Item -Path "obs-src\libobs\*" -Destination $incPath -Recurse -Force
          
          # 2. 暴力搜索并平铺关键头文件
          $searchFiles = @("obs-frontend-api.h", "pthread.h", "sched.h")
          foreach ($f in $searchFiles) {
              $found = Get-ChildItem -Path "obs-src" -Recurse -Filter $f | Select-Object -First 1
              if ($found) { 
                  Write-Host "Found $f at $($found.FullName), copying to root include..."
                  Copy-Item -Path $found.FullName -Destination $incPath -Force 
              }
          }
          
          # 3. 生成 obsconfig.h
          $configContent = "#pragma once`n#define OBS_VERSION ""32.0.4"""
          Set-Content -Path "$incPath\obsconfig.h" -Value $configContent -Encoding UTF8
          
          # 4. 下载运行包
          gh release download 32.0.4 --repo obsproject/obs-studio --pattern "OBS-Studio-32.0.4-Windows-x64.zip" --clobber
          mkdir obs-bin
          cmd.exe /c "tar -xf OBS-Studio-32.0.4-Windows-x64.zip -C obs-bin"
          echo "EXTERNAL_INCLUDE_DIR=$incPath" >> $env:GITHUB_ENV

      - name: Download Dependencies (Qt6/FFmpeg)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir zip-temp
          $tag = gh release view --repo obsproject/obs-deps --json tagName --template '{{.tagName}}'
          gh release download $tag --repo obsproject/obs-deps --pattern "windows-deps-*-x64.zip" --dir "zip-temp" --clobber
          gh release download $tag --repo obsproject/obs-deps --pattern "windows-deps-qt6-*-x64.zip" --dir "zip-temp" --clobber
          mkdir obs-deps
          Get-ChildItem "zip-temp/*.zip" | ForEach-Object { cmd.exe /c "tar -xf $($_.FullName) -C obs-deps" }
          $qt6File = Get-ChildItem -Path "$env:GITHUB_WORKSPACE\obs-deps" -Recurse -Filter "Qt6Config.cmake" | Select-Object -First 1
          echo "Qt6_DIR=$($qt6File.Directory.Parent.Parent.Parent.FullName)" >> $env:GITHUB_ENV
          echo "DepsPath=$env:GITHUB_WORKSPACE\obs-deps" >> $env:GITHUB_ENV

      - name: Reconstruct Import Libs
        shell: pwsh
        run: |
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $binDir = Get-ChildItem -Path "$vsPath\VC\Tools\MSVC\*\bin\Hostx64\x64" | Select-Object -First 1
          $dumpbin = Join-Path $binDir.FullName "dumpbin.exe"
          $libTool = Join-Path $binDir.FullName "lib.exe"
          
          mkdir generated-libs
          $libsDir = "$env:GITHUB_WORKSPACE\generated-libs"
          
          function Generate-Lib {
              param ($NameFilter, $OutDir, $ToolPath, $DumpPath)
              $Dll = Get-ChildItem -Path "obs-bin" -Recurse -Filter "$NameFilter.dll" | Select-Object -First 1
              if ($null -eq $Dll) { return }
              
              $libFile = Join-Path $OutDir "$($Dll.BaseName).lib"
              $defFile = Join-Path $OutDir "$($Dll.BaseName).def"
              
              $exports = & $DumpPath /exports $Dll.FullName
              "EXPORTS" | Out-File -FilePath $defFile -Encoding ASCII
              $exports | ForEach-Object { 
                  if ($_ -match "^\s+\d+\s+[0-9a-fA-F]+\s+[0-9a-fA-F]+\s+(\S+)") { 
                      $matches[1] | Out-File -FilePath $defFile -Append -Encoding ASCII 
                  } 
              }
              # 修正后的链接参数格式
              & $ToolPath /def:$defFile /machine:x64 "/out:$libFile"
          }
          
          Generate-Lib "obs" $libsDir $libTool $dumpbin
          Generate-Lib "obs-frontend-api" $libsDir $libTool $dumpbin
          
          $pthreadDll = Get-ChildItem -Path "obs-bin" -Recurse -Filter "*pthread*.dll" | Select-Object -First 1
          if ($pthreadDll) { 
              Generate-Lib $pthreadDll.BaseName $libsDir $libTool $dumpbin
              echo "REAL_PTHREAD_NAME=$($pthreadDll.BaseName)" >> $env:GITHUB_ENV 
          }
          echo "GENERATED_LIB_DIR=$libsDir" >> $env:GITHUB_ENV

      - name: Build Plugin
        shell: pwsh
        run: |
          cd my-plugin
          cmake -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_PREFIX_PATH="${{ env.DepsPath }};${{ env.Qt6_DIR }}" `
            -DEXTERNAL_INCLUDE_DIR="${{ env.EXTERNAL_INCLUDE_DIR }}" `
            -DPTHREAD_LIB_NAME="${{ env.REAL_PTHREAD_NAME }}" `
            -DGENERATED_LIB_DIR="${{ env.GENERATED_LIB_DIR }}"
          cmake --build build --config Release

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: obs-text-slideshow-32.0.4-x64
          path: my-plugin/build/Release/*.dll
